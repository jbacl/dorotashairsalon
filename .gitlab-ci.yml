stages:
  - deploy

deploy_to_ec2:
  stage: deploy
  script:
    - echo "Setting up SSH..."
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H ec2-3-135-223-80.us-east-2.compute.amazonaws.com >> ~/.ssh/known_hosts
    - echo "Deploying to EC2..."
    - ssh -i "$DEPLOY_SSH_KEY" ubuntu@ec2-3-135-223-80.us-east-2.compute.amazonaws.com "
        cd /home/ubuntu/my-project &&
        git pull origin main &&
        npm install &&
        pm2 restart all
      "
  only:
    - main



